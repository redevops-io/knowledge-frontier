[project]
name = "knowledge-frontier"
version = "0.1.0"
description = "Domain-neutral 'what to learn/teach next' primitive: a prerequisite concept graph + mastery model + deterministic frontier selection (TEACH / REVIEW / ASSESS / STOP)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "ReDevOps" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["knowledge_frontier"]
